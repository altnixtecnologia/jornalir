name: Patrocinadores - biblioteca unica (sem deploy)

on:
  pull_request:
    branches: [solicitacoes-financeiro-contratos-irc-20261031]
    paths:
      - "apps/sistema/src/features/configuracoes/SiteAdSlotsPanel.tsx"
      - "apps/sistema/src/features/configuracoes/siteAdLibrary.ts"
      - "apps/sistema/src/app/sistema/configuracoes/patrocinadores/**"
      - "apps/sistema/src/app/globals.css"
      - "apps/sistema/test/site-ad-library.test.ts"
      - "apps/sistema/test/site-ad-publication.test.ts"
      - ".github/workflows/validate-patrocinadores-biblioteca.yml"
      - "apps/sistema/src/lib/permissions/staffPermissionsCatalog.ts"
      - "apps/sistema/src/middleware.ts"
      - "apps/sistema/src/app/sistema/patrocinadores/**"
      - "apps/sistema/src/components/admin/MobileNav.tsx"
      - "apps/sistema/src/components/admin/AdminHeader.tsx"
      - "apps/sistema/src/app/sistema/configuracoes/page.tsx"
      - "apps/sistema/src/app/sistema/configuracoes/valores-assine/**"
      - "apps/sistema/src/features/usuarios/UsersManager.tsx"
      - "apps/sistema/src/lib/navigation.ts"
      - "apps/sistema/src/app/sistema/configuracoes/notificacoes-push/**"
      - "apps/sistema/src/app/sistema/page.tsx"
      - "apps/sistema/test/sponsor-operator-permissions.test.ts"
      - "supabase/migrations/20261117171920_sponsor_operator_permissions.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund
      - name: Testar biblioteca unica e publicacao manual
        run: |
          npx tsx --test apps/sistema/test/site-ad-library.test.ts
          npx tsx --test apps/sistema/test/sponsor-operator-permissions.test.ts
          npx tsx --test apps/sistema/test/site-ad-publication.test.ts
      - name: Typecheck do sistema
        run: npm run typecheck --workspace @ir/sistema
      - name: Build do sistema sem publicar
        run: npm run build --workspace @ir/sistema
