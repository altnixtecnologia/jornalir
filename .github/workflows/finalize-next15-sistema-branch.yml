name: Persistir upgrade Next 15 validado (somente branch isolada)

on:
  push:
    branches:
      - security/next15-system-20261108
    paths:
      - ".github/workflows/finalize-next15-sistema-branch.yml"

permissions:
  contents: write

concurrency:
  group: finalize-next15-sistema-isolated
  cancel-in-progress: false

jobs:
  persist-only-after-validation:
    if: github.ref == 'refs/heads/security/next15-system-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SIGNATURE_DELIVERY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout seguro da branch de segurança
        uses: actions/checkout@v4
        with:
          ref: security/next15-system-20261108
          fetch-depth: 1
          persist-credentials: true

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar lockfile original
        run: npm ci --no-audit --no-fund

      - name: Atualizar Next e React somente no workspace administrativo
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/sistema/package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          Object.assign(manifest.dependencies, {
            next: '15.5.29', react: '19.1.10', 'react-dom': '19.1.10'
          });
          Object.assign(manifest.devDependencies, {
            '@types/react': '^19.0.0', '@types/react-dom': '^19.0.0'
          });
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          npm install --no-audit --no-fund

      - name: Testar instalação limpa a partir do NOVO lockfile
        run: |
          npm ci --no-audit --no-fund
          node -e "let x=require(require.resolve('next/package.json',{paths:[require('path').resolve('apps/sistema')]}));if(x.version!=='15.5.29')throw Error('Versão Next divergente: '+x.version)"

      - name: Migrar rotas por codemod oficial no runner
        run: |
          npx --yes @next/codemod@15.5.29 next-async-request-api apps/sistema/src/app --force
          # O endpoint FCM reexporta handlers e não recebe params/searchParams.
          git restore --source=HEAD -- apps/sistema/src/app/api/public/push/fcm/route.ts
          if grep -R -n '@next-codemod-error' apps/sistema/src/app --include='*.ts' --include='*.tsx'; then
            echo "Codemod deixou pendências; nada será gravado no GitHub." >&2
            exit 1
          fi
          git diff --check
          git diff --stat -- apps/sistema/src/app apps/sistema/package.json package-lock.json

      - name: Verificar tipos e quatro testes de assinaturas
        run: |
          npm run typecheck --workspace @ir/sistema
          NODE_OPTIONS=--conditions=react-server npx tsx --test \
            apps/sistema/test/external-signature-placement.test.ts \
            apps/sistema/test/external-signed-pdf-smoke.test.ts \
            apps/sistema/test/google-signature-proof.test.ts \
            apps/sistema/test/public-verification.test.ts

      - name: Build real do sistema administrativo com lockfile reproduzível
        run: npm run build --workspace @ir/sistema

      - name: Gravar SOMENTE arquivos validados na branch de segurança
        run: |
          test "$GITHUB_REF" = "refs/heads/security/next15-system-20261108"
          git add -- package-lock.json apps/sistema/package.json apps/sistema/src/app
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nenhuma mudança adicional: branch já atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): upgrade Next 15 React 19 e migrar APIs assíncronas"
          git push origin HEAD:refs/heads/security/next15-system-20261108
          echo "Nenhum merge em main, nenhuma migration, nenhum deploy de produção."
