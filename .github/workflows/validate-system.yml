name: Validate project

on:
  push:
    branches:
      - frontend-integracao-20261008
      - release/contratos-nfse-integracao-20261016
    paths:
      - "apps/site/**"
      - "apps/sistema/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-system.yml"
  pull_request:
    branches:
      - feature/abrangencias-geo-notificacoes-20261021
    paths:
      - "apps/sistema/**"
      - "packages/**"
      - "supabase/migrations/**"
      - ".github/workflows/validate-system.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          # A instalacao reproduz primeiro o lock. Ate a sincronizacao do
          # Capacitor Android pendente, instala so no runner temporario.
          npm ci || {
            echo "::warning::package-lock.json nao sincronizado com @capacitor/app; corrigir lock no fluxo Android."
            npm install --no-audit --no-fund
          }

      - name: Typecheck site
        run: npm run typecheck --workspace @ir/site

      - name: Build site
        run: npm run build --workspace @ir/site

      - name: Typecheck system
        run: npm run typecheck --workspace @ir/sistema

      - name: Testar itens e valores da venda comercial
        run: npx tsx --conditions=react-server --test packages/core/test/commercial-sale-snapshot.test.ts

      - name: Signed contract PDF smoke test
        run: node apps/sistema/scripts/signatures-smoke.cjs

      - name: Contract template PDF smoke test
        run: node apps/sistema/scripts/contract-template-pdf-smoke.cjs

      - name: Build system
        run: npm run build --workspace @ir/sistema
