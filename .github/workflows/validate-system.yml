name: Validate project

on:
  push:
    branches:
      - frontend-integracao-20261008
      - release/contratos-nfse-integracao-20261016
    paths:
      - "apps/site/**"
      - "apps/sistema/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/validate-system.yml"
  pull_request:
    branches:
      - feature/abrangencias-geo-notificacoes-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-system:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci || {
            echo "::warning::package-lock.json pendente de sincronizacao com o app Android."
            npm install --no-audit --no-fund
          }

      - name: Typecheck site
        run: npm run typecheck --workspace @ir/site

      - name: Build site
        run: npm run build --workspace @ir/site

      - name: Typecheck system
        run: npm run typecheck --workspace @ir/sistema

      - name: Testar pacotes comerciais e historico de servicos
        run: npx tsx --test packages/core/test/commercial-sale-snapshot.test.ts

      - name: Testar conferencia de contratos comerciais
        run: npx tsx --test apps/sistema/test/commercial-contract-preview.test.ts

      - name: Testar renderização da minuta comercial
        run: npx tsx --test apps/sistema/test/commercial-legal-draft.test.ts

      - name: Testar qualificação jurídica de clientes
        run: npx tsx --test apps/sistema/test/commercial-qualification.test.ts

      - name: Testar preço individual e preço total dos contratos
        run: npx tsx --test apps/sistema/test/commercial-document-amount.test.ts

      - name: Testar identificação jurídica das partes no modelo
        run: npx tsx --test apps/sistema/test/commercial-party-requirements.test.ts

      - name: Testar lista e papéis de signatários comerciais
        run: npx tsx --test apps/sistema/test/commercial-signers.test.ts

      - name: Testar troca de capa da matéria
        run: npx tsx --test apps/sistema/test/article-cover-choice.test.ts

      - name: Signed contract PDF smoke test
        run: node apps/sistema/scripts/signatures-smoke.cjs

      - name: Contract template PDF smoke test
        run: node apps/sistema/scripts/contract-template-pdf-smoke.cjs

      - name: Build system
        run: npm run build --workspace @ir/sistema
