name: Resolve PDF signing library lock

on:
  push:
    branches:
      - release/contratos-nfse-integracao-20261016
    paths:
      - ".github/workflows/resolve-pdf-lib-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/contratos-nfse-integracao-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Refresh reproducible npm lockfile
        run: npm install pdf-lib@1.17.1 --workspace @ir/sistema --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/sistema/package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock pdf-lib for signed-contract PDF pages"
            git push origin HEAD:release/contratos-nfse-integracao-20261016
          fi
