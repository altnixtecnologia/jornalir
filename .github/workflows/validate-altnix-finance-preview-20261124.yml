name: Integração Jornal-Informativo consulta financeira (sem deploy)
on:
  pull_request:
    branches: [solicitacoes-financeiro-contratos-irc-20261031]
    paths:
      - "apps/sistema/src/lib/integrations/altnixFinanceReadContract.ts"
      - "apps/sistema/src/app/api/integrations/altnix/finance-preview/**"
      - "apps/sistema/test/altnix-finance-bridge-readonly.test.ts"
      - ".github/workflows/validate-altnix-finance-preview-20261124.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Escopo, autenticação, recusa e somente leitura
        run: npx tsx --test apps/sistema/test/altnix-finance-bridge-readonly.test.ts
      - name: TypeScript
        run: npm run typecheck --workspace @ir/sistema
      - name: Build sem deploy
        run: npm run build --workspace @ir/sistema
