name: Experimento Next 15 Portal (sem deploy)

on:
  push:
    branches:
      - security/next15-portal-20261109
    paths:
      - ".github/workflows/next15-portal-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar lockfile oficial
        run: npm ci --no-audit --no-fund
      - name: Instalar Next 15 / React 19 somente no portal, em runner descartável
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file='apps/site/package.json';
          const pkg=JSON.parse(fs.readFileSync(file,'utf8'));
          Object.assign(pkg.dependencies,{next:'15.5.29',react:'19.1.10','react-dom':'19.1.10'});
          Object.assign(pkg.devDependencies,{'@types/react':'^19.0.0','@types/react-dom':'^19.0.0'});
          fs.writeFileSync(file,JSON.stringify(pkg,null,2)+'\n');
          NODE
          npm install --no-package-lock --no-save --no-audit --no-fund
          node -e "let p=require(require.resolve('next/package.json',{paths:[require('path').resolve('apps/site')]}));console.log('Portal Next '+p.version);if(p.version!=='15.5.29')process.exit(1)"
      - name: Transformar APIs de rota somente em memória do runner
        run: |
          npx --yes @next/codemod@15.5.29 next-async-request-api apps/site/src/app --force
          if grep -R -n '@next-codemod-error' apps/site/src/app --include='*.ts' --include='*.tsx'; then
            echo "Codemod exige revisão antes de avançar" >&2
            exit 1
          fi
          git diff --stat -- apps/site/src/app
      - name: Verificar TypeScript do Portal
        run: npm run typecheck --workspace @ir/site
      - name: Compilar Portal Next 15 sem deploy
        run: npm run build --workspace @ir/site
