name: Usuarios e configuracoes sensiveis (sem deploy)
on:
  pull_request:
    branches: [solicitacoes-financeiro-contratos-irc-20261031]
    paths:
      - "apps/sistema/src/app/sistema/usuarios/**"
      - "apps/sistema/src/app/sistema/configuracoes/cobrancas/**"
      - "apps/sistema/src/features/usuarios/**"
      - "apps/sistema/src/lib/permissions/permissionsDraft.ts"
      - "apps/sistema/test/permissions-draft.test.ts"
      - "apps/sistema/test/usuarios-sensitive-settings.test.ts"
      - ".github/workflows/validate-usuarios-sensitive-settings-20261124.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  autorizacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verificar grants, confirmação e acesso a dados sensíveis
        run: |
          npx tsx --test apps/sistema/test/permissions-draft.test.ts
          npx tsx --test apps/sistema/test/usuarios-sensitive-settings.test.ts
          npx tsx --test apps/sistema/test/staff-access-policy.test.ts
      - name: Typecheck do sistema
        run: npm run typecheck --workspace @ir/sistema
      - name: Build sem deploy
        run: npm run build --workspace @ir/sistema
