name: Coproprietário Gestão - tipos e build sem deploy
on:
  push:
    branches:
      - feat/mai-gestao-coproprietario-20261110
  pull_request:
    paths:
      - "apps/sistema/src/lib/auth/**"
      - "apps/sistema/src/features/usuarios/**"
      - "apps/sistema/src/features/perfil/**"
      - "apps/sistema/src/components/admin/AccountMenu.tsx"
      - "apps/sistema/src/app/sistema/usuarios/**"
      - "supabase/migrations/*business_coowner*.sql"
      - ".github/workflows/validate-business-coowner-20261110.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Regressões de autorização e fluxo Auth
        run: |
          NODE_OPTIONS=--conditions=react-server npx tsx --test apps/sistema/test/staff-auth-redirect.test.ts
          NODE_OPTIONS=--conditions=react-server npx tsx --test apps/sistema/test/auth-confirm-flow.test.ts
          npx tsx --test apps/sistema/test/permissions-draft.test.ts
      - name: TypeScript
        run: npm run typecheck --workspace @ir/sistema
      - name: Build administrativo sem deploy
        run: npm run build --workspace @ir/sistema
