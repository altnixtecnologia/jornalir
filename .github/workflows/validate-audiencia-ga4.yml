name: Verificar central de audiência GA4 (sem deploy)

on:
  pull_request:
    branches: [solicitacoes-financeiro-contratos-irc-20261031]
    paths:
      - "apps/sistema/src/lib/audiencia/**"
      - "apps/sistema/src/app/sistema/editorial/audiencia/**"
      - "apps/sistema/src/app/sistema/editorial/materias/page.tsx"
      - "apps/sistema/src/lib/navigation.ts"
      - "apps/sistema/test/audiencia-ga4-report.test.ts"
      - ".github/workflows/validate-audiencia-ga4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audiencia:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SIGNATURE_DELIVERY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Testes de período e relatórios GA4
        run: npx tsx --test apps/sistema/test/audiencia-ga4-report.test.ts
      - name: TypeScript do sistema
        run: npm run typecheck --workspace @ir/sistema
      - name: Build do sistema sem deploy
        run: npm run build --workspace @ir/sistema
