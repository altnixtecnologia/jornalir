name: Persistir upgrade Next 15 Portal (branch isolada, sem deploy)

on:
  push:
    branches:
      - security/next15-portal-20261109
    paths:
      - ".github/workflows/finalize-next15-portal-branch.yml"

permissions:
  contents: write

concurrency:
  group: finalize-next15-portal-isolated
  cancel-in-progress: false

jobs:
  commit-only-after-validation:
    if: github.ref == 'refs/heads/security/next15-portal-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      SIGNATURE_DELIVERY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4
        with:
          ref: security/next15-portal-20261109
          fetch-depth: 1
          persist-credentials: true
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalação original
        run: npm ci --no-audit --no-fund
      - name: Atualizar manifesto Portal e lockfile sem alterar Sistema
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path='apps/site/package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          Object.assign(pkg.dependencies,{
            next:'15.5.29',react:'19.1.10','react-dom':'19.1.10'
          });
          Object.assign(pkg.devDependencies,{
            '@types/react':'^19.0.0','@types/react-dom':'^19.0.0'
          });
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          // Pacotes compartilhados (@ir/ui) também resolvem React a partir
          // da raiz do monorepo. Fixar a MESMA versão evita dois runtimes
          // incompatíveis no SSR (404/useContext).
          const root=JSON.parse(fs.readFileSync('package.json','utf8'));
          root.dependencies={...(root.dependencies||{}),
            react:'19.1.10','react-dom':'19.1.10'};
          fs.writeFileSync('package.json',JSON.stringify(root,null,2)+'\n');
          NODE
          npm install --no-audit --no-fund
          # Com os dois apps em React 19, tentar remover a cópia 18 deixada
          # no topo pelo lockfile antigo. Sem forçar peers ou mudar runtime.
          npm dedupe --no-audit --no-fund
      - name: Instalação limpa do lockfile FINAL em ambos os apps
        run: |
          npm ci --no-audit --no-fund
          node - <<'NODE'
          const path=require('node:path');
          for(const workspace of ['apps/site','apps/sistema']){
            const home=path.resolve(workspace);
            for(const p of ['next','react']){
              const v=require(require.resolve(p+'/package.json',{paths:[home]})).version;
              console.log(workspace+' '+p+': '+v);
              if(p==='next'&&v!=='15.5.29')throw Error('Next não atualizado');
              if(p==='react'&&v!=='19.1.10')throw Error('React não atualizado');
            }
          }
          NODE
      - name: Diagnóstico de versões React no lockfile gerado
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path');
          for(const from of ['.','apps/site','apps/sistema','packages/ui','node_modules/react-pageflip','apps/site/node_modules/next']){
            const root=path.resolve(from);
            const found={from};
            for(const pkg of ['react','react-dom','next']){
              try{
                const file=require.resolve(pkg+'/package.json',{paths:[root]});
                found[pkg]={version:JSON.parse(fs.readFileSync(file)).version,path:path.relative(process.cwd(),file)};
              }catch(e){found[pkg]=String(e.code||e.message);}
            }
            console.log(JSON.stringify(found));
          }
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const [name,v] of Object.entries(lock.packages||{})){
            if(name.endsWith('/react')||name.endsWith('/react-dom'))console.log('LOCK '+name+' '+v.version);
          }
          NODE
      - name: Codemod oficial de rotas do Portal
        run: |
          npx --yes @next/codemod@15.5.29 next-async-request-api apps/site/src/app --force
          if grep -R -n '@next-codemod-error' apps/site/src/app --include='*.ts' --include='*.tsx'; then
            echo "Pendências codemod: abortar commit." >&2
            exit 1
          fi
          git diff --check
          git diff --stat -- apps/site/src/app apps/site/package.json package-lock.json
      - name: Verificar portal e sistema com MESMO lockfile
        run: |
          npm run typecheck --workspace @ir/site
          npm run typecheck --workspace @ir/sistema
          npm run build --workspace @ir/site
          npm run build --workspace @ir/sistema
      - name: Persistir somente portal e lockfile na branch isolada
        run: |
          test "$GITHUB_REF" = "refs/heads/security/next15-portal-20261109"
          git add -- package.json apps/site/package.json apps/site/src/app package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Branch já atualizada; nada a gravar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(security): portal Next15 React19 e migração das rotas públicas"
          git push origin HEAD:refs/heads/security/next15-portal-20261109
          echo "Sem merge, sem deploy de produção, sem tocar no Supabase."
