name: Supabase incremental upgrade rehearsal

on:
  pull_request:
    branches:
      - feature/abrangencias-geo-notificacoes-20261021
    paths:
      - "supabase/migrations/**"
      - "tests/release/**"
      - "tests/security/full-schema-rls-postflight.sql"
      - ".github/workflows/supabase-incremental-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  incrementally-upgrade-local-db:
    name: Upgrade existing fictional data from 152 to 195 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exactly this reviewed branch
        uses: actions/checkout@v4

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      # A production possui 152 migrations no ledger. Três arquivos locais foram
      # renomeados aos carimbos remotos SQL-idênticos. Criamos o MESMO
      # estado-base em Docker isolado e só então ensaiamos o upgrade.
      # NÃO usar --linked, db push, nem chaves do projeto Production.
      - name: Preparar baseline local de 152 migrations, sem tocar o remoto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jornalir-pending-migrations
          for file in supabase/migrations/*.sql; do
            name="${file##*/}"
            version="${name%%_*}"
            if [[ "$version" > "20261029101300" ]]; then
              mv "$file" /tmp/jornalir-pending-migrations/
            fi
          done
          test "$(find /tmp/jornalir-pending-migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 43
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 152

      - name: Start isolated Supabase Docker
        run: supabase start

      - name: Reset ONLY Docker local schema to old baseline
        run: supabase db reset --local --no-seed

      - name: Install psql client if necessary
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -qq -y postgresql-client
          fi

      - name: Seed a fictional legacy employee with pending email
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f tests/release/incremental-before.sql

      - name: Restore all 43 new migrations
        run: |
          set -euo pipefail
          mv /tmp/jornalir-pending-migrations/*.sql supabase/migrations/
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 195

      - name: Apply only the pending migrations to EXISTING local data
        run: supabase migration up --local

      - name: Verify preserved historical data and invitation safeguards
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f tests/release/incremental-after.sql

      - name: Verify security of upgraded schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f tests/security/full-schema-rls-postflight.sql

      - name: Require clean SQL function lint
        run: supabase db lint --local --schema public

      - name: Stop ephemeral services
        if: always()
        run: supabase stop --no-backup || true
