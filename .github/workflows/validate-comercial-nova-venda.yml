name: Comercial - venda multiproduto e descontos (sem deploy)

on:
  pull_request:
    branches: [solicitacoes-financeiro-contratos-irc-20261031]
    paths:
      - "apps/sistema/src/features/comercial/CommercialSaleForm.tsx"
      - "apps/sistema/src/features/comercial/CommercialSaleDetail.tsx"
      - "apps/sistema/src/app/sistema/publicidade/vendas/**"
      - "apps/sistema/test/commercial-sale-multi-item-discount.test.ts"
      - "apps/sistema/src/app/globals.css"
      - "packages/core/src/comercial/commercial-sale-service.ts"
      - ".github/workflows/validate-comercial-nova-venda.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund
      - name: Testar linhas, desconto em reais/porcentagem e dados legados
        run: |
          npx tsx --test apps/sistema/test/commercial-sale-multi-item-discount.test.ts
          npx tsx --test packages/core/test/commercial-sale-snapshot.test.ts
          npx tsx --test apps/sistema/test/commercial-finance-guards.test.ts
      - name: Checar tipos do sistema
        run: npm run typecheck --workspace @ir/sistema
      - name: Compilar sistema sem publicar
        run: npm run build --workspace @ir/sistema
