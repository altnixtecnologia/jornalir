name: Finance RLS sandbox

on:
  pull_request:
    branches:
      - feature/abrangencias-geo-notificacoes-20261021
    paths:
      - "supabase/migrations/202611031*.sql"
      - "supabase/migrations/202611041*.sql"
      - "supabase/migrations/202611051*.sql"
      - "tests/security/finance-rls-sandbox-*.sql"
      - "tests/security/module-rls-sandbox-*.sql"
      - "tests/security/editorial-rls-sandbox-*.sql"
      - ".github/workflows/finance-rls-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-rls-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Reproduzir roles e politicas antigas sem dados reais
        run: psql -v ON_ERROR_STOP=1 -f tests/security/finance-rls-sandbox-setup.sql

      - name: Aplicar regras de convite confirmado
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103100000_confirmed_staff_authorization.sql

      - name: Aplicar RLS e guardas financeiros
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103103000_finance_actions_rls.sql

      - name: Testar concessoes/negativas/baixa sem usar producao
        run: psql -v ON_ERROR_STOP=1 -f tests/security/finance-rls-sandbox-assertions.sql

      - name: Montar tabelas isoladas de Clientes, Assinaturas e Comercial
        run: psql -v ON_ERROR_STOP=1 -f tests/security/module-rls-sandbox-setup.sql

      - name: Aplicar regras granulares dos módulos
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104100000_nonfinancial_module_action_rls.sql

      - name: Proteger função privilegiada de cadastro de cliente
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104101000_save_client_action_guard.sql

      - name: Testar bloqueios e operações por módulo
        run: psql -v ON_ERROR_STOP=1 -f tests/security/module-rls-sandbox-assertions.sql

      - name: Montar notícias e aniversariantes fictícios
        run: psql -v ON_ERROR_STOP=1 -f tests/security/editorial-rls-sandbox-setup.sql

      - name: Proteger RPCs privilegiadas e publicação automática
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105100000_editorial_privileged_rpc_guards.sql

      - name: Aplicar permissões editoriais e de aniversários
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261105101000_editorial_birthdays_rls.sql

      - name: Testar edição, publicação, convites e acesso aos RPCs
        run: psql -v ON_ERROR_STOP=1 -f tests/security/editorial-rls-sandbox-assertions.sql
