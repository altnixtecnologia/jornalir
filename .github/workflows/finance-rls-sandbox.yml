name: Finance RLS sandbox

on:
  pull_request:
    branches:
      - feature/abrangencias-geo-notificacoes-20261021
    paths:
      - "supabase/migrations/202611031*.sql"
      - "tests/security/finance-rls-sandbox-*.sql"
      - ".github/workflows/finance-rls-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finance-rls-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Reproduzir roles e politicas antigas sem dados reais
        run: psql -v ON_ERROR_STOP=1 -f tests/security/finance-rls-sandbox-setup.sql

      - name: Aplicar regras de convite confirmado
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103100000_confirmed_staff_authorization.sql

      - name: Aplicar RLS e guardas financeiros
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261103103000_finance_actions_rls.sql

      - name: Testar concessoes/negativas/baixa sem usar producao
        run: psql -v ON_ERROR_STOP=1 -f tests/security/finance-rls-sandbox-assertions.sql
