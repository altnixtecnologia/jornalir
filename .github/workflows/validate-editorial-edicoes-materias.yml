name: Editorial - edicoes e materias responsivo (sem deploy)

on:
  pull_request:
    branches: [solicitacoes-financeiro-contratos-irc-20261031]
    paths:
      - "apps/sistema/src/features/editorial/**"
      - "apps/sistema/src/app/sistema/editorial/**"
      - "apps/sistema/src/providers/supabase/articleRepository.supabase.ts"
      - "apps/sistema/src/app/globals.css"
      - "apps/sistema/test/editorial-edition-groups.test.ts"
      - ".github/workflows/validate-editorial-edicoes-materias.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar workspaces
        run: npm ci --no-audit --no-fund
      - name: Testar agrupamento e fluxos editoriais
        run: |
          npx tsx --test apps/sistema/test/editorial-edition-groups.test.ts
          npx tsx --test apps/sistema/test/materias-admin-page-performance.test.ts
          npx tsx --test apps/sistema/test/edition-archive-recognition.test.ts
      - name: Typecheck do sistema
        run: npm run typecheck --workspace @ir/sistema
      - name: Build do sistema sem publicar
        run: npm run build --workspace @ir/sistema
