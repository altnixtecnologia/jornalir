name: NFS-e - preparacao oficial sem transmissao

on:
  pull_request:
    paths:
      - "apps/sistema/src/lib/release/releasePolicy.ts"
      - "apps/sistema/src/lib/permissions/checkModuleAction.ts"
      - "apps/sistema/src/lib/navigation.ts"
      - "apps/sistema/src/middleware.ts"
      - "apps/sistema/src/components/admin/AdminHeader.tsx"
      - "apps/sistema/src/components/admin/MobileNav.tsx"
      - "apps/sistema/src/app/sistema/nfse/**"
      - "apps/sistema/test/prepublication-release-gates.test.ts"
      - "apps/sistema/test/nfse-preparacao-oficial.test.ts"
      - "apps/sistema/next.config.mjs"
      - "apps/sistema/test/verify-nfse-xsd-trace.mjs"
      - ".github/workflows/validate-nfse-preparacao-oficial-20261114.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nfse-preparacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar-sem-emissao:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-key
      NEXT_TELEMETRY_DISABLED: "1"
      NFSE_ARCHIVE_ENABLED: "false"
      NFSE_DELIVERY_ENABLED: "false"
      SIGNATURE_DELIVERY_ENABLED: "false"
    steps:
      - name: Checkout somente do pull request
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Dependencias sem scripts externos
        run: npm ci --no-audit --no-fund

      - name: Testar autorizacao restrita e bloqueios fiscais
        env:
          NODE_OPTIONS: --conditions=react-server
        run: >
          npx tsx --test
          apps/sistema/test/nfse-preparacao-oficial.test.ts
          apps/sistema/test/prepublication-release-gates.test.ts
          apps/sistema/test/nfse-p0-release-safety.test.ts
          apps/sistema/test/nfse-danfse-release-gate.test.ts

      - name: TypeScript
        run: npm run typecheck --workspace @ir/sistema

      - name: Compilar sem deploy na Vercel
        env:
          NODE_ENV: production
        run: npm run build --workspace @ir/sistema

      - name: Verificar se XSDs oficiais acompanham as funcoes serverless
        run: node apps/sistema/test/verify-nfse-xsd-trace.mjs
