name: NFS-e - cadastro seguro e fluxo mobile sem transmissao

on:
  push:
    branches:
      - feature/nfse-cadastro-seguro-mobile-homologacao-20261112
  pull_request:
    paths:
      - "apps/sistema/src/app/sistema/nfse/nova/**"
      - "apps/sistema/src/app/sistema/clientes/[id]/page.tsx"
      - "apps/sistema/src/features/nfse/NfseDraftForm.tsx"
      - "apps/sistema/src/components/admin/ClientPicker.tsx"
      - "apps/sistema/src/lib/nfse/**"
      - "apps/sistema/test/nfse-tomador-snapshot.test.ts"
      - "apps/sistema/test/nfse-competency.test.ts"
      - "packages/core/src/nfse/draft-service.ts"
      - "packages/core/test/nfse.test.ts"
      - "packages/core/src/nfse/dps-builder.ts"
      - "packages/core/test/dps-builder.test.ts"
      - ".github/workflows/validate-nfse-safe-draft-20261112.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-key
      NEXT_TELEMETRY_DISABLED: "1"
      SIGNATURE_DELIVERY_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Testar isolamento de snapshots e autorizacao
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test apps/sistema/test/nfse-tomador-snapshot.test.ts apps/sistema/test/nfse-competency.test.ts packages/core/test/nfse-client-snapshot.test.ts packages/core/test/nfse.test.ts packages/core/test/dps-builder.test.ts

      - name: Validar tipos
        run: npm run typecheck --workspace @ir/sistema

      - name: Compilar Next.js sem publicar na Vercel
        run: npm run build --workspace @ir/sistema
