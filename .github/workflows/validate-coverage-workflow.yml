name: Cobertura de eventos - testes e tipos
on:
  push:
    branches:
      - feat/cobertura-evento-transferencia-20261109
      - feat/pauta-tv-equipe-fechamento-20261109
      - feat/tv-pauta-pareamento-sem-login-20261109
      - feat/pauta-tarefas-por-pessoa-catalogo-20261109
      - fix/agenda-aviso-flutuante-escolha-rapida-20261110
      - feat/agenda-fluxo-simples-baixas-20261110
  pull_request:
    branches:
      - solicitacoes-financeiro-contratos-irc-20261031
    paths:
      - "apps/sistema/src/features/agenda/**"
      - "apps/sistema/src/lib/notifications/**"
      - "apps/sistema/src/app/api/cron/push/**"
      - "apps/sistema/public/sw.js"
      - "apps/sistema/test/coverage-reminder.test.ts"
      - "apps/sistema/test/coverage-clock.test.ts"
      - "apps/sistema/test/pauta-tv-layout.test.ts"
      - "apps/sistema/test/coverage-task-catalog.test.ts"
      - "apps/sistema/src/features/pauta-tv/**"
      - "apps/sistema/src/app/tv/pauta/**"
      - "apps/sistema/src/app/api/tv-pauta/**"
      - "apps/sistema/src/app/sistema/configuracoes/**"
      - "apps/sistema/src/lib/tv-pauta/**"
      - "supabase/migrations/20261122300000_tv_pauta_device_pairing.sql"
      - "apps/sistema/src/middleware.ts"
      - "supabase/migrations/20261122290000_coverage_team_agenda_pauta.sql"
      - "supabase/migrations/20261122310000_coverage_tasks_catalog_per_user.sql"
      - "supabase/migrations/20261122320000_coverage_task_media_combined.sql"
      - "supabase/migrations/20261122330000_editorial_workflow_simple.sql"
      - "supabase/migrations/20261122270000_event_coverage_lifecycle.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-test-key
      SIGNATURE_DELIVERY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Instalar
        run: npm ci --no-audit --no-fund
      - name: Lembretes e fluxo editorial
        run: npx tsx --test apps/sistema/test/coverage-task-catalog.test.ts apps/sistema/test/pauta-tv-layout.test.ts apps/sistema/test/coverage-clock.test.ts apps/sistema/test/coverage-reminder.test.ts apps/sistema/test/pauta-period.test.ts apps/sistema/test/agenda-pauta-navigation.test.ts
      - name: TypeScript administrativo
        run: npm run typecheck --workspace @ir/sistema
