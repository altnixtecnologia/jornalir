# Configuração da Supabase CLI para o projeto site-system-ir (IR Core).
# Usado só para desenvolvimento local (`supabase start`) e para aplicar as
# migrations deste diretório contra o projeto remoto (`supabase link` +
# `supabase db push`) — nenhum segredo vive neste arquivo.
project_id = "site-system-ir"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3001"]
jwt_expiry = 3600
enable_signup = false
